name: Release
# Policy: tag only when `main` CI is green and docs checks in `docs/PUBLIC_RELEASE.md` are satisfied.
# Builds multi-arch prebuilts for one-click install.sh / install.ps1 / Homebrew.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]*"
      - "v[0-9]+.[0-9]+.[0-9]*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach assets to (e.g. v1.3.0). Empty = use github.ref_name."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: harness-linux-x86_64
            smoke: native
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            artifact: harness-linux-aarch64
            cross: true
            smoke: verify

          # macOS — pin Intel runner for x86_64; Apple Silicon runner for arm64
          - target: x86_64-apple-darwin
            runner: macos-13
            artifact: harness-macos-x86_64
            smoke: native
          - target: aarch64-apple-darwin
            runner: macos-14
            artifact: harness-macos-aarch64
            smoke: native

          # Windows
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            artifact: harness-windows-x86_64.exe
            smoke: native

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64 Linux)
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.cross
        run: cross build --profile release-lto --target ${{ matrix.target }}

      - name: Build release binary
        if: "!matrix.cross"
        run: cargo build --profile release-lto --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release-lto/harness ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release-lto/harness.exe ${{ matrix.artifact }}

      - name: Smoke test binary (Unix — native)
        if: runner.os != 'Windows' && matrix.smoke == 'native'
        run: |
          test -f "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          "./${{ matrix.artifact }}" --version
          "./${{ matrix.artifact }}" --help >/dev/null

      - name: Verify binary artifact (cross-built)
        if: runner.os != 'Windows' && matrix.smoke == 'verify'
        run: |
          test -f "${{ matrix.artifact }}"
          test -s "${{ matrix.artifact }}"
          file "${{ matrix.artifact }}"

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path -LiteralPath '${{ matrix.artifact }}')) { throw 'artifact missing' }
          & ".\${{ matrix.artifact }}" --version
          & ".\${{ matrix.artifact }}" --help | Out-Null

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Attach GitHub Release assets
    needs: build
    # Publish whatever matrix legs succeeded (one-click degrades gracefully per OS)
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=v1.3.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
        continue-on-error: true

      - name: Generate checksums
        run: |
          cd artifacts
          shopt -s nullglob
          files=(harness-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found" >&2
            exit 1
          fi
          ls -la
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Harness ${{ steps.tag.outputs.name }}
          files: |
            artifacts/*
          fail_on_unmatched_files: false
          generate_release_notes: false
          draft: false
