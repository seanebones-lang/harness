name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  supply-chain:
    name: Supply chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check workspace
        run: cargo check --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets

      - name: Build release-lto
        run: cargo build --profile release-lto

      - name: Test
        run: cargo test --all

  install-scripts:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: unix
          - os: macos-latest
            kind: unix
          - os: windows-latest
            kind: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run scripts/install.sh
        if: matrix.kind == 'unix'
        env:
          HARNESS_INSTALL_DIR: ${{ runner.temp }}/harness-ci-bin
        run: |
          mkdir -p "$HARNESS_INSTALL_DIR"
          bash scripts/install.sh
          "$HARNESS_INSTALL_DIR/harness" --version
          "$HARNESS_INSTALL_DIR/harness" --help >/dev/null

      - name: Run scripts/install.ps1
        if: matrix.kind == 'windows'
        env:
          HARNESS_INSTALL_DIR: ${{ runner.temp }}\harness-ci-bin
        run: |
          New-Item -ItemType Directory -Force -Path $env:HARNESS_INSTALL_DIR | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          & "$env:HARNESS_INSTALL_DIR\harness.exe" --version
          & "$env:HARNESS_INSTALL_DIR\harness.exe" --help | Out-Null

  vscode-extension:
    name: VS Code extension compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile extension
        working-directory: extensions/vscode
        run: |
          npm install
          npm run compile

  desktop-tauri:
    name: Desktop Tauri check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - name: cargo check (Tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo check

  smoke-rel01:
    name: REL-01 automated subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build harness
        run: cargo build
      - name: Run smoke_rel01.sh
        run: bash scripts/smoke_rel01.sh
