name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  container:
    name: Container runtime acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build locked production image
        run: docker build -t harness:ci .
      - name: Verify runtime image and provider integration
        run: bash scripts/smoke_container.sh harness:ci

  supply-chain:
    name: Supply chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@cargo-audit
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo audit
        run: cargo audit
      - name: cargo deny
        run: cargo deny check

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo check workspace
        run: cargo check --locked --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Build release-lto
        run: cargo build --locked --profile release-lto

      - name: Test
        run: cargo test --locked --workspace --all-features

  install-scripts:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: unix
          - os: macos-latest
            kind: unix
          - os: windows-latest
            kind: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Installer contract tests
        if: matrix.kind == 'unix'
        run: python3 scripts/test_install.py

      - name: Run scripts/install.sh
        if: matrix.kind == 'unix'
        env:
          HARNESS_INSTALL_SOURCE: "1"
          HARNESS_INSTALL_DIR: ${{ runner.temp }}/harness-ci-bin
        run: |
          mkdir -p "$HARNESS_INSTALL_DIR"
          bash scripts/install.sh
          "$HARNESS_INSTALL_DIR/harness" --version
          "$HARNESS_INSTALL_DIR/harness" --help >/dev/null

      - name: Run scripts/install.ps1
        shell: pwsh
        if: matrix.kind == 'windows'
        env:
          HARNESS_INSTALL_SOURCE: "1"
          HARNESS_INSTALL_DIR: ${{ runner.temp }}\harness-ci-bin
        run: |
          New-Item -ItemType Directory -Force -Path $env:HARNESS_INSTALL_DIR | Out-Null
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          & "$env:HARNESS_INSTALL_DIR\harness.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed version check failed" }
          & "$env:HARNESS_INSTALL_DIR\harness.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed help check failed" }

  vscode-extension:
    name: VS Code extension compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile extension
        working-directory: extensions/vscode
        run: |
          npm ci
          npm audit
          npm run compile

  desktop-tauri:
    name: Desktop Tauri check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm ci
      - uses: taiki-e/install-action@cargo-deny
      - name: Desktop dependency advisories
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --config apps/desktop/src-tauri/deny.toml check advisories
      - name: cargo check (Tauri)
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

  smoke-rel01:
    name: REL-01 automated subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build harness
        run: cargo build --locked
      - name: Run smoke_rel01.sh
        env:
          HARNESS_BIN: ${{ github.workspace }}/target/debug/harness
        run: bash scripts/smoke_rel01.sh

      - name: Agent and HTTP integration smoke
        run: python3 scripts/smoke_agent.py target/debug/harness

  web-ui:
    name: Embedded web UI regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test actual embedded script
        working-directory: static
        run: |
          npm ci
          npm audit
          npm test
