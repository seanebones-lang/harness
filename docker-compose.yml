# First run: docker compose run --rm harness setup
# Chat after setup: docker compose run --rm harness
services:
  harness:
    build: .
    command: []
    volumes:
      - harness-state:/home/harness/.harness
      - .:/workspace
    depends_on:
      - ollama
    stdin_open: true
    tty: true

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  harness-state:
  ollama-models:
