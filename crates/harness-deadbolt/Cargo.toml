[package]
name = "harness-deadbolt"
description = "Harness re-export of the Apache-2.0 deadbolt crate. Not a model tool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["deadbolt"]
deadbolt = ["deadbolt-dep"]

[dependencies]
deadbolt-dep = { package = "n11-deadbolt", git = "https://github.com/seanebones-lang/deadbolt", rev = "52a2085155b658f3d1dda5a73a8d95a7a1d88fad", optional = true }
