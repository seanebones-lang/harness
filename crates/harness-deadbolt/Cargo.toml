[package]
name = "harness-deadbolt"
description = "Harness re-export of the Apache-2.0 deadbolt crate. Not a model tool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["deadbolt"]
deadbolt = ["deadbolt-dep"]

[dependencies]
deadbolt-dep = { package = "n11-deadbolt", git = "https://github.com/seanebones-lang/deadbolt", rev = "7d130e882d03b9ba82556fb072f646d4191bbe8a", optional = true }
