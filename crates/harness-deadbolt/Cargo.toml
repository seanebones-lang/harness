[package]
name = "harness-deadbolt"
description = "Harness re-export of the Apache-2.0 deadbolt crate. Not a model tool."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["deadbolt"]
deadbolt = ["deadbolt-dep"]

[dependencies]
deadbolt-dep = { package = "n11-deadbolt", git = "https://github.com/seanebones-lang/deadbolt", rev = "e87519f700be03c27a564ed274907649224d256f", optional = true }
