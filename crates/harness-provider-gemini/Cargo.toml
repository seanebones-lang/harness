[package]
name = "harness-provider-gemini"
version = "0.1.2-beta"
edition = "2021"
license = "MIT"

[dependencies]
harness-provider-core = { path = "../harness-provider-core" }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"