# https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[advisories]
version = 2
yanked = "warn"
ignore = [
    "RUSTSEC-2025-0141", # bincode unmaintained (via syntect)
    "RUSTSEC-2024-0436", # paste unmaintained (via ratatui)
    "RUSTSEC-2026-0002", # lru unsound (via ratatui)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Unlicense",
]
private = { ignore = true }
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
