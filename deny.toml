# https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check
#
# PRODUCT LICENSE (NextEleven Harness itself):
#   LicenseRef-NextEleven-Proprietary — NextEleven LLC
#   Public GitHub = proof-of-concept source visibility ONLY.
#   NOT MIT. NOT open source. NOT a grant to use/copy/redistribute.
#
# The [licenses].allow list below is ONLY for third-party crates.io
# dependencies required to compile the POC. Allowing "MIT" there does
# NOT relicense this repository. Do not add a product MIT license.

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive / no safe upgrade yet
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained via syntect" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via ratatui" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained via age/i18n-embed-fl; no safe upgrade" },
]

[licenses]
version = 2
# Third-party dependency licenses only (build graph). Product = proprietary.
allow = [
    # Common OSS dependency licenses (crates.io transitive graph)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Unlicense",
    # Many Rust ecosystem crates are MIT OR Apache-2.0 dual; cargo-deny
    # needs MIT listed to accept the MIT side of dual-licensed deps.
    # THIS IS NOT A PRODUCT LICENSE.
    "MIT",
    # Workspace product license (NextEleven LLC proprietary — not crates.io OSS)
    "LicenseRef-NextEleven-Proprietary",
]
private = { ignore = true }
confidence-threshold = 0.85
exceptions = [
    # keyring → turso path; tiny crate, no license field on crates.io
    # Exception is dependency-only; product remains proprietary.
    { allow = ["MIT"], crate = "cfg_block" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
