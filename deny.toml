# https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive / no safe upgrade yet
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained via syntect" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via ratatui" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained via age/i18n-embed-fl; no safe upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Unlicense",
]
private = { ignore = true }
confidence-threshold = 0.85
exceptions = [
    # keyring → turso path; tiny crate, no license field on crates.io
    { allow = ["MIT"], crate = "cfg_block" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
