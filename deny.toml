# Dependency policy for MIT-licensed Harness. Third-party licenses remain their own.
# Run: cargo deny check

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive / no safe upgrade yet
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained via syntect" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via ratatui" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained via age/i18n-embed-fl; no safe upgrade" },
    # New advisories from 2026-09-14 scan
    { id = "RUSTSEC-2026-0221", reason = "event-listener 5.4.1 unsound; transitive via async-channel, no safe upgrade" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.12.5 use-after-free; transitive, no safe upgrade" },
    { id = "RUSTSEC-2026-0002", reason = "lru 0.12.5 IterMut stacked borrows; transitive, no safe upgrade" },
]

[licenses]
version = 2
# Licenses permitted in the dependency build graph.
allow = [
    # Common OSS dependency licenses (crates.io transitive graph)
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "OpenSSL",
    "Unlicense",
    # Many Rust ecosystem crates are MIT OR Apache-2.0 dual; cargo-deny
    # needs MIT listed to accept the MIT side of dual-licensed deps.
    "MIT",
]
private = { ignore = true }
confidence-threshold = 0.85
exceptions = [
    # keyring → turso path; tiny crate, no license field on crates.io
    # Dependency-specific exception retained from the original policy.
    { allow = ["MIT"], crate = "cfg_block" },
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
