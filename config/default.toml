# Harness configuration — copy to ~/.harness/config.toml or .harness/config.toml
# Run `harness init` to generate this automatically.

[provider]
# Your Anthropic API key. Can also be set via ANTHROPIC_API_KEY env var.
# api_key = "sk-ant-..."

# May 2026 model choices:
#   Anthropic: claude-opus-4-7 | grok-4.3 | claude-haiku-4-5
#   xAI:       grok-4.3 (flagship) | grok-4.20-0309-reasoning (pinned) | grok-4.1-fast
#   OpenAI:    gpt-5.5 | gpt-5.4 | gpt-5.4-mini | o4-mini
#   Ollama:    qwen3-coder:30b | qwen2.5-coder:32b (local, free)
model = "grok-4.3"

max_tokens = 8192
temperature = 0.7

# Override the API base URL (useful for local proxies or testing)
# base_url = "https://api.anthropic.com/v1"

[agent]
# Default matches `DEFAULT_SYSTEM` in src/agent.rs when this block is omitted.
system_prompt = """
You are a powerful coding assistant running in a terminal.

Available tools:
  read_file, write_file     — read or overwrite files
  patch_file                — surgical old→new text replacement (prefer over write_file for edits)
  apply_patch               — apply a unified diff across multiple files atomically (prefer for multi-file edits)
  list_dir                  — list directory contents
  shell                     — run shell commands (build, test, etc.)
  git                       — typed git operations: status/diff/add/commit/branch/push/log/blame/restore
  test_runner               — run project tests with structured pass/fail output
  search_code               — regex search across the codebase
  spawn_agent               — run a sub-agent with base tools for parallel tasks
  spawn_swarm               — queue parallel background tasks (harness swarm list / result)
  find_definition           — LSP go-to-definition across the codebase
  find_references           — LSP find all references to a symbol
  rename_symbol             — LSP safe rename across files
  diagnostics               — LSP errors/warnings for a file
  browser (when enabled)    — Chrome CDP: navigate, screenshot, click, fill forms
  web_search (when enabled) — provider-native web search (no extra config needed)
  bash (when enabled)       — provider-native sandboxed code execution
  MCP tools (when loaded)   — any tools registered via .harness/mcp.json
  gh                        — GitHub CLI wrapper: PR/issue/CI workflow

Guidelines:
  - Prefer patch_file for single-file edits, apply_patch for multi-file changes.
  - Use the git tool for all git operations instead of shell git commands.
  - Always run test_runner after changes to verify correctness.
  - Use web_search when you need up-to-date information or documentation.
  - Be concise. Prefer making changes over explaining them.
  - When editing multiple files, use spawn_agent for parallelism.
  - In plan mode (--plan flag), destructive calls pause for user approval.
"""

[memory]
# Set to false to disable semantic memory recall.
enabled = true

# Embedding model for semantic search.
# "nomic-embed-text" (local, via Ollama) or "voyage-3.5" (Anthropic recommended, requires VOYAGE_API_KEY)
embed_model = "nomic-embed-text"

# Override the SQLite path for the memory store.
# db_path = "~/.harness/memory.db"

[ambient]
# Background consolidation: merge recent memory fragments via router fast + embed routes.
# enabled = true
# interval_secs = 300
# min_new = 5
# top_k = 20
# consolidation_model = "grok-4.1-fast"

[tools]
# Filesystem sandbox for read_file / write_file / patch_file / list_dir / apply_patch.
# strict = paths must stay under the workspace root (default).
# relaxed = warn but allow paths outside the root. off = disable checks.
sandbox = "strict"

# Optional SQLite tool (workspace-sandboxed paths only). Off by default.
[tools.database]
enabled = false
readonly = true
max_rows = 500

# Optional Jupyter .ipynb cell read/edit. Off by default.
[tools.notebook]
enabled = false

# Optional allowlisted Docker CLI (ps/logs/compose_ps/compose_logs/images). Off by default.
# allow_mutating unlocks compose_up only — never run/build/rm or docker.sock mounts.
[tools.docker]
enabled = false
allow_mutating = false
timeout_secs = 60

[approval]
# auto = never pause (default). smart = pause for new-file writes + shell confirm patterns.
# plan = pause for all destructive tool calls (same as harness --plan).
# mode = "auto"
# auto_approve = ["read_file", "list_dir"]
# always_ask = ["shell:git push", "write_file"]

# [shell]
# Optional allowlist for argv0 when the command starts with an absolute path.
# cmd_allowlist = ["/usr/bin/git", "/usr/bin/cargo"]

[session]
# Path to the SQLite sessions database.
# db_path = "~/.harness/sessions.db"

[mcp]
# Path to your MCP server configuration.
# Harness also checks .harness/mcp.json and ~/.harness/mcp.json automatically.
# config_path = ".harness/mcp.json"
# Optional: restrict which MCP server binaries may be spawned (basename or full path).
# When omitted, defaults to: npx, node, python3, uvx
# command_allowlist = ["npx", "node", "python3", "uvx"]

[budget]
# Spending limits — Harness warns at 80% and blocks at 100%.
# daily_usd = 5.00     # max daily spend in USD
# monthly_usd = 50.00  # max monthly spend in USD

[computer_use]
# ⚠️  DANGER: When enabled, the agent can control your mouse, keyboard, and screen.
# Only enable with Claude 4.7+ (claude-opus-4-7).
# Requires: cliclick (macOS: brew install cliclick) or xdotool (Linux).
# See docs/COMPUTER_USE.md for per-OS sandbox defaults and risks.
# enabled = false

[notifications]
# Desktop notifications (macOS Notification Center / Linux libnotify).
# enabled = true              # set to false to disable all notifications
# on_background_done = true   # notify when a background run finishes
# on_autotest_fail = true     # notify when auto-test fails
# on_budget = true            # notify at 80% / 100% of budget thresholds

[native_tools]
# Enable provider-managed server-side tools.
# These are billed per call by the provider (e.g. xAI: $5/1k calls).
# web_search = false      # provider-native web search (Anthropic, xAI)
# code_execution = false  # sandboxed code execution (Anthropic bash, xAI)
# x_search = false        # X (Twitter) post search (xAI only)

[browser]
# Enable the CDP browser tool. Requires Chrome launched with:
#   chrome --remote-debugging-port=9222 --headless
# Can also be enabled at runtime with: harness --browser
# enabled = false
# url = "http://localhost:9222"

# Example .harness/mcp.json:
# {
#   "mcpServers": {
#     "filesystem": {
#       "command": "npx",
#       "args": ["-y", "@modelcontextprotocol/server-filesystem", "/home/user"],
#       "env": {}
#     },
#     "github": {
#       "command": "npx",
#       "args": ["-y", "@modelcontextprotocol/server-github"],
#       "env": { "GITHUB_TOKEN": "ghp_..." }
#     }
#   }
# }

# ── Phase E (optional) ──────────────────────────────────────────────────────
# Uncomment keys below only when you add matching sections to harness Config,
# or paste into a sidecar — unknown top-level tables break `harness` today.

[router]
# Smart defaults when unset: anthropic → xai → openai → mistral → ollama (see CLAUDE.md).
# default = "anthropic"
# fast_model = "anthropic:claude-haiku-4-5"
# heavy_model = "anthropic:claude-opus-4-7"
# embed_model = "ollama:nomic-embed-text"
# fallback = ["anthropic", "xai", "openai", "mistral", "ollama"]

# Multi-provider table (keys = provider kind). Also auto-detected from env keys.
# [providers.openai]
# api_key = "sk-..."   # or OPENAI_API_KEY
# model = "gpt-5.5"
# # base_url = "https://api.openai.com/v1"   # optional override
#
# [providers.mistral]   # OpenAI-compatible → https://api.mistral.ai/v1
# api_key = "..."       # or MISTRAL_API_KEY
# model = "mistral-large-latest"
#
# [providers.openai-compatible]   # any OpenAI-format /v1 endpoint (requires base_url)
# api_key = "..."
# model = "my-model"
# base_url = "http://127.0.0.1:8000/v1"
#
# # Or any custom name with base_url → treated as OpenAI-compatible under that name:
# [providers.my-proxy]
# api_key = "..."
# model = "local"
# base_url = "http://127.0.0.1:11434/v1"

# [observability]
# enabled = true
# traces_dir = "~/.harness/traces"
# otlp_experimental_endpoint = ""   # base URL e.g. "http://localhost:4318" → POST .../v1/traces (experimental JSON; legacy: otlp_endpoint)

# [swarm]
# max_concurrency = 4
# db_path = "~/.harness/swarm.db"
# auto_gc_stale_secs = 86400   # optional: reap orphans older than N seconds on startup
# worker_tool_allowlist = ["read_file", "list_dir", "search_code", "test_runner"]
# worker_max_tool_calls = 50   # reserved (agent loop hard-cap is 50)
# worker_max_wall_secs = 600   # fail worker if wall clock exceeded
# registry_url = ""            # optional remote swarm (stub until W7.1 HTTP client)

# [collab]
# enabled = false
# max_users = 10   # enforced on WS join; see docs/COLLAB.md

# [bridges.obsidian]
# enabled = false
# vault = "MyVault"
# folder = "NextEleven Harness"

# [bridges.notes]
# enabled = false

# [bridges.calendar]
# enabled = false
# calendar = "NextEleven Harness"

# [bridges.github_projects]
# enabled = false
# owner = "you"
# project_number = 1

# Daemon transport (Unix socket on macOS/Linux; loopback TCP on Windows).
# [daemon]
# transport = "auto"   # auto | unix | tcp

